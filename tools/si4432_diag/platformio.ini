; Si4432 wiring / health check for ESP32 DevKit V1. Receive-only: this firmware
; never puts the chip into TX.
;
;   pio run -e diag                       (build)
;   pio run -e diag -t upload --upload-port COM5
;   pio device monitor -b 115200 -p COM5

[platformio]
default_envs = diag

[env:diag]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wall
